name: Modellcharts

on:
  schedule:
    # GFS-Läufe (00/06/12/18 UTC) sind nach rund 4 Stunden vollständig verfügbar
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systembibliotheken für Cartopy
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev libproj-dev proj-data libeccodes-dev
      - run: pip install -r requirements.txt
      - name: Klimatologie und Kartendaten zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            climo
            ~/.local/share/cartopy
          key: climo-cartopy-v1
      - run: python build_charts.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
